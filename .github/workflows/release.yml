# A tag v* publishes a GitHub release: the archive (client, protocol, console, gateway, deploy script), the client
# alone and SHA256SUMS, under fixed names so that .../releases/latest/download/<name> always gives the latest.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Selftest
        run: |
          python -m pip install --quiet cryptography spake2
          python client/mmbox.py selftest
          python -m py_compile app/mmbox_console.py gateway/mmbox_gateway.py
      - name: Build
        run: |
          paths="client app gateway deploy README.md LICENSE"
          git archive --format=tar.gz --prefix=mmbox/ -o mmbox.tar.gz HEAD $paths
          git archive --format=zip --prefix=mmbox/ -o mmbox.zip HEAD $paths
          cp client/mmbox.py client/PROTOCOL.md .
          sha256sum mmbox.tar.gz mmbox.zip mmbox.py PROTOCOL.md > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mmbox.tar.gz mmbox.zip mmbox.py PROTOCOL.md SHA256SUMS \
            --title "mmbox $GITHUB_REF_NAME" --generate-notes --verify-tag
